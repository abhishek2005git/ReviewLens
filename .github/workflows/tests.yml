name: Cross-platform checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Load the included trained model
        run: python -c "from app import create_app; client = create_app().test_client(); health = client.get('/api/health').get_json(); assert health['training_rows'] == 649879; assert health['model_name'] == 'TF-IDF + Linear SVM'; result = client.post('/api/predict', json={'review':'Excellent food and wonderful service!'}); assert result.status_code == 200; assert result.get_json()['rating'] in range(1, 6); print(health)"
